name: Thea Verifier

on:
  pull_request:
    paths:
      - "thea/**"
      - "tests/test_thea_verifier.py"
      - "docs/THEA_VERIFIER_V0_1.md"
      - "REPO_MAP.md"
      - ".github/workflows/thea-verifier.yml"

permissions:
  contents: read

jobs:
  deterministic-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Thea
        run: python -m compileall -q thea tests/test_thea_verifier.py

      - name: Run deterministic verifier tests
        run: python -m pytest -q tests/test_thea_verifier.py
